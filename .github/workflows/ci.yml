name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et compilation — sans publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Transition provisoire : remplacer par npm ci après ajout d'un package-lock.json vérifié.
      - name: Installer les dépendances sans scripts tiers
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier TypeScript et compiler Vite
        run: npm run build
