name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et compilation — sans publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier l'installation reproductible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier TypeScript et compiler Vite
        run: npm run build
      - name: Consigner les preuves techniques
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Contrôles techniques L0"
            echo ""
            echo "- Révision : \`$GITHUB_SHA\`"
            echo "- Branche : \`$GITHUB_REF_NAME\`"
            echo "- Statut du job : \`$JOB_STATUS\`"
            echo "- Commandes prévues : \`npm ci --ignore-scripts --no-audit --no-fund\`, \`npm test\`, \`npm run build\`"
            echo "- Détails et éventuels échecs : consulter les étapes du job ci-dessus."
            echo "- Validation pédagogique humaine : non réalisée par ce workflow."
            echo "- Publication : aucune."
          } >> "$GITHUB_STEP_SUMMARY"
