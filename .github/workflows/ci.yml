name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et compilation — sans publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier l'installation reproductible
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exécuter les tests
        id: tests
        run: npm test
      - name: Vérifier TypeScript et compiler Vite
        id: build
        run: npm run build
      - name: Installer Playwright pour la recette navigateur (sans modifier le verrou)
        id: browser_install
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Exécuter la recette navigateur M01
        id: browser_test
        run: node tests/browser-smoke.mjs
      - name: Consigner les preuves techniques
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_INSTALL_OUTCOME: ${{ steps.browser_install.outcome }}
          BROWSER_TEST_OUTCOME: ${{ steps.browser_test.outcome }}
        run: |
          {
            echo "## Contrôles techniques L0"
            echo ""
            echo "- Révision : \`$GITHUB_SHA\`"
            echo "- Branche : \`$GITHUB_REF_NAME\`"
            echo "- Statut du job : \`$JOB_STATUS\`"
            echo "- Installation (npm ci) : \`$INSTALL_OUTCOME\`"
            echo "- Tests (npm test) : \`$TESTS_OUTCOME\`"
            echo "- Compilation (npm run build) : \`$BUILD_OUTCOME\`"
            echo "- Installation navigateur : \`$BROWSER_INSTALL_OUTCOME\`"
            echo "- Recette navigateur M01 : \`$BROWSER_TEST_OUTCOME\`"
            echo "- Valeurs possibles : success, failure, skipped ou cancelled ; une étape ignorée ne vaut pas réussite."
            echo "- Détails et éventuels échecs : consulter les étapes du job ci-dessus."
            echo "- Validation pédagogique humaine : non réalisée par ce workflow."
            echo "- Publication : aucune."
          } >> "$GITHUB_STEP_SUMMARY"
