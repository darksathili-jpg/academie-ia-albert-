name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et compilation — sans publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier l'installation reproductible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier TypeScript et compiler Vite
        run: npm run build
