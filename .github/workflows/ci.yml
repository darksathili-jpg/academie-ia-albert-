name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et compilation — sans publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Transition temporaire : produire un verrou depuis le runner réseau.
      # Après récupération et vérification de l'artifact, versionner package-lock.json
      # puis remplacer cette étape par npm ci, sans génération.
      - name: Générer un verrou npm provisoire
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Vérifier l'installation reproductible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Conserver le verrou pour vérification humaine et commit ultérieur
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidat
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier TypeScript et compiler Vite
        run: npm run build
