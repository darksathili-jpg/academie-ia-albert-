name: Préproduction GitHub Pages — recette uniquement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academie-ia-albert-pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Contrôles bloquants de préproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier l'avertissement de préproduction
        run: |
          set -eu
          grep -Fq 'PRÉPRODUCTION — CONTENUS NON VALIDÉS — NE PAS UTILISER EN CLASSE' src/main.tsx
          echo "Préproduction non validée : publication autorisée pour recette uniquement."
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exécuter les tests
        run: npm test
      - name: Compiler le site
        run: npm run build
      - name: Installer Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Recette automatisée M01
        run: node tests/browser-smoke.mjs
      - name: Transmettre le site compilé
        uses: actions/upload-artifact@v4
        with:
          name: site-pages-valide
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publier:
    name: Déployer la préproduction après contrôles
    needs: verifier
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Télécharger le site contrôlé
        uses: actions/download-artifact@v4
        with:
          name: site-pages-valide
          path: dist/
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
